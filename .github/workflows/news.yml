name: World Pulse Daily Auto News

on:
  workflow_dispatch:
  schedule:
    # Runs 5 times per day.
    # GitHub cron uses UTC time.
    # Sri Lanka time is UTC +5:30.
    - cron: "0 2,6,10,14,18 * * *"

jobs:
  create-news-video:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      PAGE_NAME: "WORLD PULSE DAILY"
      LANGUAGE: "en"
      US_NEWS_RATIO: "0.85"
      POST_TO_FACEBOOK: "1"
      HIDE_IMAGE_CORNER_LOGOS: "1"
      SHOW_SOURCE_TEXT: "0"
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        run: python bot.py

      - name: Save output and state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add output/ assets/ state/ || true

          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Auto news video update"
            git push
          fi
