name: World Pulse Daily Auto Video

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Sri Lanka 7:00 AM, 11:00 AM, 3:00 PM, 7:00 PM, 10:00 PM = UTC below.
    - cron: "30 1 * * *"
    - cron: "30 5 * * *"
    - cron: "30 9 * * *"
    - cron: "30 13 * * *"
    - cron: "30 16 * * *"

permissions:
  contents: write

jobs:
  create-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create and post video
        env:
          PAGE_NAME: "WORLD PULSE DAILY"
          LANGUAGE: "en"
          POST_TO_FACEBOOK: "1"
          HIDE_IMAGE_CORNER_LOGOS: "1"
          SHOW_SOURCE_TEXT: "0"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python bot.py

      - name: Save used-news memory to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/used.json output/latest_news.json || true
          git commit -m "Update World Pulse Daily bot state" || echo "No state changes to commit"
          git push || echo "Nothing to push"

      - name: Upload generated video as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-pulse-daily-output
          path: |
            output/*.mp4
            output/latest_news.json
          if-no-files-found: ignore
